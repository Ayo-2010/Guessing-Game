<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A modern and interactive number guessing game with beautiful UI design">
    <meta name="theme-color" content="#6366f1">
    <title>Guess My Number - Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <h1 class="title">🎮 Guess My Number</h1>
                <p class="subtitle">Challenge yourself to find the secret number</p>
            </div>

            <div class="stats">
                <div class="stat-box">
                    <span class="stat-label">Range</span>
                    <span class="stat-value" id="range">1 - 100</span>
                </div>
                <div class="stat-box">
                    <span class="stat-label">Attempts</span>
                    <span class="stat-value" id="attempts">10</span>
                </div>
                <div class="stat-box">
                    <span class="stat-label">Best Score</span>
                    <span class="stat-value" id="best">—</span>
                </div>
            </div>

            <div class="message-box" id="message">
                I'm thinking of a number between <strong id="minVal">1</strong> and <strong id="maxVal">100</strong>. Can you guess it?
            </div>

            <form id="guessForm">
                <div class="input-group">
                    <input 
                        type="number" 
                        id="guessInput" 
                        placeholder="Enter your guess..." 
                        min="1" 
                        max="100" 
                        required
                        autocomplete="off"
                        aria-label="Your guess"
                    >
                    <button id="guessBtn" type="submit" class="btn btn-primary" aria-label="Submit your guess">
                        <span>Guess</span>
                    </button>
                </div>
            </form>

            <div class="button-group">
                <button id="restartBtn" type="button" class="btn btn-secondary" aria-label="Start a new game">
                    🔄 New Game
                </button>
            </div>

            <div class="footer">
                <p class="hint">💡 Tip: The hints will guide you towards the correct number!</p>
            </div>
        </div>
    </div>

    <script src="Game.js" defer></script>
</body>
</html>
